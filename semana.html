<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--bg:transparent;--white:#f7f7fa;--muted:#a2a2ad;--red:#ff293d;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--white);padding:14px}
.card{background:linear-gradient(145deg,rgba(26,26,34,.98),rgba(16,16,21,.98));border:1px solid #34343d;border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.section-title{font-size:16px;font-weight:800;margin:0 0 3px}
.section-sub{font-size:12px;color:var(--muted);margin:0}
.week-controls{display:flex;align-items:center;gap:6px}
.icon-btn,.today-btn,.add-btn{font:inherit;color:var(--white);background:#202027;border:1px solid #3b3b44;border-radius:7px;cursor:pointer;min-height:34px}
.icon-btn{width:34px;font-size:16px}
.today-btn{padding:0 8px;font-size:11px}
.date-label{font-size:11px;color:#d2d2da;text-align:right;margin-top:4px}
.summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;background:#111116;border:1px solid #303039;border-radius:9px;margin-bottom:10px}
.summary-kicker{font-size:9px;text-transform:uppercase;color:#ff5262;font-weight:800}
.summary-num{font-size:18px;font-weight:850;margin-top:2px}
.progress-track{height:6px;background:#292930;border-radius:8px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#c7001d,#ff3a4d)}
.percent{font-size:18px;font-weight:850;color:#ff5666}
.table-scroll{overflow-x:auto;border:1px solid #33333c;border-radius:8px}
.tracker{width:100%;min-width:560px;border-collapse:collapse;text-align:center}
.tracker th{font-size:9px;text-transform:uppercase;color:#b6b6bf;font-weight:750;padding:8px 4px;border-bottom:1px solid #35353e}
.tracker th:first-child{text-align:left;padding-left:10px;width:170px}
.tracker td{padding:5px 4px;border-bottom:1px solid #282830}
.habit-cell{display:flex;align-items:center;gap:8px;text-align:left;min-height:34px;padding-left:6px}
.habit-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.habit-name{width:100%;background:transparent;border:0;color:#f4f4f7;font:inherit;font-size:12px;font-weight:650}
.day-btn{width:34px;height:34px;border-radius:8px;border:1px solid #36363f;background:#19191f;color:transparent;cursor:pointer;display:inline-grid;place-items:center;font-size:14px}
.day-btn[aria-checked="true"]{color:white;background:linear-gradient(145deg,#ff4054,#c80822);border-color:#ff6878}
.day-btn[aria-checked="true"]:before{content:"✓"}
.habit-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.add-btn{padding:0 10px;color:#ff6978;border-color:#6c1c28;background:rgba(255,41,61,.07);font-size:11px;font-weight:750}
.limit-note{font-size:10px;color:#92929d}
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div><h2 class="section-title">Sua semana em foco</h2><p class="section-sub">Escolha hábitos e acompanhe seu ritmo.</p></div>
    <div>
      <div class="week-controls"><button class="icon-btn" id="prev">‹</button><button class="today-btn" id="today">Hoje</button><button class="icon-btn" id="next">›</button></div>
      <div class="date-label" id="range"></div>
    </div>
  </div>
  <div class="summary">
    <div>
      <div class="summary-kicker">Consistência</div>
      <div class="summary-num" id="count">0 de 35</div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="fill"></div></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>
  <div class="table-scroll"><table class="tracker"><thead><tr><th>Hábito</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th><th>Dom</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="habit-actions"><button class="add-btn" id="add">＋ Adicionar</button><span class="limit-note" id="limit">Até 8 hábitos</span></div>
</div>
<script>
(()=>{
const STORAGE='livia-habit-tracker-v1';
const defaultHabits=[{id:'water',name:'Beber água'},{id:'move',name:'Movimentar o corpo'},{id:'read',name:'Ler ou estudar'},{id:'care',name:'Autocuidado'},{id:'rest',name:'Cuidar do descanso'}];
let state={habits:defaultHabits,checks:{}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&Array.isArray(saved.habits)&&saved.checks)state=saved;}catch(e){}
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;};
const today=new Date();let weekStart=mondayOf(today);
const weekDates=()=>Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
const fmt=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'});
const rows=document.getElementById('rows');
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function render(){
 const dates=weekDates();document.getElementById('range').textContent=`${fmt.format(dates[0])} — ${fmt.format(dates[6])}`;
 const weekKey=dateKey(weekStart);if(!state.checks[weekKey])state.checks[weekKey]={};
 rows.innerHTML='';let complete=0;const total=state.habits.length*7;
 state.habits.forEach(h=>{const tr=document.createElement('tr');const first=document.createElement('td');const cell=document.createElement('div');cell.className='habit-cell';const dot=document.createElement('i');dot.className='habit-dot';const input=document.createElement('input');input.className='habit-name';input.value=h.name;input.maxLength=34;input.addEventListener('change',()=>{h.name=input.value.trim()||'Novo hábito';persist();render();});cell.append(dot,input);first.append(cell);tr.append(first);
 dates.forEach(d=>{const td=document.createElement('td');const b=document.createElement('button');b.type='button';b.className='day-btn';const key=dateKey(d);const checked=!!state.checks[weekKey][h.id]?.includes(key);if(checked)complete++;b.setAttribute('aria-checked',String(checked));b.addEventListener('click',()=>{const existing=state.checks[weekKey][h.id]||[];state.checks[weekKey][h.id]=existing.includes(key)?existing.filter(x=>x!==key):[...existing,key];persist();render();});td.append(b);tr.append(td);});rows.append(tr);});
 const pct=total?Math.round(complete/total*100):0;document.getElementById('count').textContent=`${complete} de ${total}`;document.getElementById('percent').textContent=`${pct}%`;document.getElementById('fill').style.width=`${pct}%`;
 document.getElementById('limit').textContent=state.habits.length>=8?'Limite atingido':`${state.habits.length} no painel`;document.getElementById('add').disabled=state.habits.length>=8;
}
document.getElementById('prev').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()-7);render();});
document.getElementById('next').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()+7);render();});
document.getElementById('today').addEventListener('click',()=>{weekStart=mondayOf(new Date());render();});
document.getElementById('add').addEventListener('click',()=>{if(state.habits.length>=8)return;state.habits.push({id:`custom-${Date.now()}`,name:'Meu hábito'});persist();render();});
render();
})();
</script>
</body>
</html>
