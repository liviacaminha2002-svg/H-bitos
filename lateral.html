<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--bg:transparent;--white:#f7f7fa;--muted:#a2a2ad;--red:#ff293d;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--white);padding:14px}
.card{background:linear-gradient(145deg,rgba(26,26,34,.98),rgba(16,16,21,.98));border:1px solid #34343d;border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.eyebrow{color:#ff4a5b;font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;margin-bottom:4px}
.section-title{font-size:16px;font-weight:800;margin:0 0 10px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.step-num{width:22px;height:22px;border-radius:6px;background:#3b1119;color:#ff5364;display:grid;place-items:center;font-weight:850;font-size:10px}
.steps strong{display:block;font-size:11px;margin-bottom:1px}
.steps span{color:#a6a6b0;font-size:10px;line-height:1.3}
.gentle{border-color:#7b1d2b;margin-top:12px}
.gentle p{font-size:11px;color:#c4c4cd;margin:0}
.quote-line{margin-top:8px;border-top:1px solid #40232a;padding-top:8px;color:#ff7582;font-size:10px;font-style:italic}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Como usar</p>
  <h2 class="section-title">Ritmo leve</h2>
  <ul class="steps">
    <li><span class="step-num">1</span><div><strong>Personalize</strong><span>Renomeie os hábitos na tabela.</span></div></li>
    <li><span class="step-num">2</span><div><strong>Marque</strong><span>Um clique por dia feito.</span></div></li>
    <li><span class="step-num">3</span><div><strong>Acompanhe</strong><span>Use a consistência com leveza.</span></div></li>
  </ul>
</div>
<div class="card gentle" style="margin-top:12px;">
  <h2 class="section-title" style="color:var(--red);font-size:14px;">● Lembrete</h2>
  <p>Um dia em branco não apaga o que construiu. Recomece quando quiser.</p>
  <div class="quote-line">Seu progresso não precisa ser perfeito.</div>
</div>
</body>
</html>
