<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--bg:transparent;--white:#f7f7fa;--red:#ff293d;--glow:0 0 16px rgba(255,41,61,.2);font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--white);padding:14px}
.card{background:linear-gradient(145deg,rgba(26,26,34,.98),rgba(16,16,21,.98));border:1px solid #34343d;border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.topline{height:2px;background:linear-gradient(90deg,transparent, #ff4151, transparent);box-shadow:0 0 12px rgba(255,25,49,.6);margin-bottom:12px}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#ff3449,#b6001c);font-size:12px;font-weight:900}
.brandname{font-size:12px;font-weight:800;letter-spacing:.1em}
.brandmeta{font-size:9px;color:#aaaab4;text-transform:uppercase}
.badge{border:1px solid #8b1928;border-radius:999px;padding:4px 10px;color:#ff6978;font-size:9px;font-weight:800;text-transform:uppercase}
.eyebrow{color:#ff4a5b;font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;margin:0 0 6px}
h1{font-size:clamp(22px,3.5vw,32px);margin:0 0 6px;font-weight:850}
.under{width:32px;height:3px;border-radius:3px;background:var(--red);box-shadow:var(--glow);margin-bottom:8px}
.subtitle{font-size:12px;color:#c3c3cd;margin:0}
</style>
</head>
<body>
<div class="card">
  <div class="topline"></div>
  <div class="brandbar">
    <div class="brand"><div class="brandmark">LC</div><div><div class="brandname">LÍVIA</div><div class="brandmeta">Vida pessoal</div></div></div>
    <div class="badge">Habit tracker</div>
  </div>
  <div class="eyebrow">Seu espaço · sua semana</div>
  <h1>Monitor de Hábitos</h1>
  <div class="under"></div>
  <p class="subtitle">Pequenos passos, acompanhados com leveza. Marque o que aconteceu — sem cobranças.</p>
</div>
</body>
</html>
